services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6
    container_name: mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  python-ms:
    build:
      context: ./orders-producer-python
      dockerfile: Dockerfile
    container_name: python-ms
    env_file:
      - ./orders-producer-python/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8000:8000"

  node-ms:
    build:
      context: ./orders-producer-node
      dockerfile: Dockerfile
    container_name: node-ms
    env_file:
      - ./orders-producer-node/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "3002:3002"
      - "4000:4000"

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    env_file:
      - ./api-gateway/.env
    depends_on:
      - python-ms
      - node-ms
    ports:
      - "3000:3000"

  admin-service:
    build:
      context: ./admin-service
      dockerfile: Dockerfile
    container_name: admin-service
    env_file:
      - ./admin-service/.env
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4001:4000"

  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
      args:
        - VITE_ADMIN_API_URL=http://localhost:4001/api
    container_name: admin-frontend
    depends_on:
      - admin-service
    ports:
      - "5174:5174"

  front:
    build:
      context: ./orders-producer-frontend
      dockerfile: Dockerfile
      args:
        - VITE_ADMIN_API_URL=http://localhost:4001/api
        - VITE_API_GATEWAY_URL=http://localhost:3000
        - VITE_WS_URL=ws://localhost:4000
    container_name: front
    depends_on:
      - api-gateway
      - admin-service
    ports:
      - "5173:5173"

volumes:
  mongo-data: